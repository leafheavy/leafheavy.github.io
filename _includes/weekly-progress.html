<aside class="weekly-progress-card" data-weekly-progress-card aria-label="Current weekly plan progress">
  <a class="weekly-progress-card__link" href="{{ '/weekly-plan/' | relative_url }}">
    <span class="weekly-progress-card__heading">
      <span class="weekly-progress-card__title">Weekly Plan</span>
      <span class="weekly-progress-card__value" data-weekly-progress-value>0%</span>
    </span>
    <span class="weekly-progress" data-weekly-progress role="progressbar" aria-label="Weekly plan completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="weekly-progress__fill" data-weekly-progress-fill></span>
    </span>
    <span class="weekly-progress-card__meta">
      <span data-weekly-progress-count>No plans yet</span>
      <span data-weekly-progress-range>2026.09.20–09.26</span>
    </span>
  </a>
</aside>
